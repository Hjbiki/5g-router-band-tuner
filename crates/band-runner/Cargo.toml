[package]
name = "band-runner"
description = "Headless band-config test runner: applies each config through safe-apply and records the signal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
router-core = { path = "../router-core" }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
