name: Release
# A pushed version tag (vX.Y.Z) is checked, built and published here, so a release needs no build
# on a PC: `release.bat --github-build` makes the commit and the tag, and prints the push command.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # A trial run from the Actions page: the same checks and build, and the installers are kept as
  # an artifact of the run. It publishes nothing.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Before the long build: the tag must be this version's, with a changelog entry to publish.
      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release/ci-release.mjs check-tag "$TAG"
      - id: rust
        shell: bash
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # A tag can read a cache saved on the main branch, not one saved by another tag, so a
      # trial run on main is what makes the next release build quick.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm tauri build -- --locked
      # The installers, the fixed-name copy the README's Download button links to, and the notes.
      - run: node tools/release/ci-release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: target/release-upload
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [checks, build]
    runs-on: ubuntu-latest
    # The only job that may write, and only to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: upload
      - name: Publish the release with its installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file upload/notes.md upload/*.exe upload/*.msi
